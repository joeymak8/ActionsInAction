name: Prac5

on: workflow_dispatch

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Show contexts and expression
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "OS: ${{ runner.os }}"
          echo "Contains: ${{ contains('Hello world', 'world') }}"

      - name: Conditional step
        if: ${{ runner.os == 'Linux' }}
        run: echo "This step runs on Linux."

      - name: Failure handler
        if: ${{ failure() }}
        run: echo "A previous step failed."
